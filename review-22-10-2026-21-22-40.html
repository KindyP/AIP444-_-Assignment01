<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .report-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            color: #fff;
            font-size: 0.9em;
        }
        .badge-low {
            background-color: #4caf50;
        }
        .badge-medium {
            background-color: #ff9800;
        }
        .badge-high {
            background-color: #f44336;
        }
        .issue {
            margin-bottom: 15px;
            padding: 10px;
            border-left: 4px solid #ddd;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        .issue p {
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="report-container">
        <h1>Code Review Report</h1>
        <p>No issues were found in the provided code/diff.</p>
    </div>
</body>
</html>
