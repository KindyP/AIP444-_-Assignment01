<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Review Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .report-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
            text-align: center;
        }
        .no-issues {
            text-align: center;
            color: #28a745;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="report-container">
        <h1>Code Review Report</h1>
        <p class="no-issues">No issues found in the code review.</p>
    </div>
</body>
</html>
